name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Current docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate current documentation
        run: python scripts/check_docs.py

  asset-gateway:
    name: Asset gateway (test + dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run gateway unit tests
        run: pnpm test:asset-gateway
      - name: Validate the Worker deployment bundle
        run: pnpm dlx wrangler@4.124.0 deploy --dry-run --outdir .wrangler-dry-run
        working-directory: apps/server/asset_gateway

  web:
    name: Web UI (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc -b
        working-directory: apps/web-ui
      - run: pnpm lint --filter @ttrpg/web-ui
      - name: Run tests with coverage
        run: pnpm test:coverage --filter @ttrpg/web-ui
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web-ui
      - name: Run browser and WASM integration tests
        run: pnpm exec vitest run --project browser --project browser-components
        working-directory: apps/web-ui
      - name: Build and package production UI
        run: |
          pnpm --filter @ttrpg/web-ui build
          python apps/server/scripts/package_web_ui.py
      - name: Upload web coverage
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: apps/web-ui/coverage/
        if: always()

  rust:
    name: Rust WASM (test + coverage + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Run tests with coverage
        run: cargo llvm-cov --locked --lib --lcov --output-path coverage.lcov
        working-directory: packages/rust-core
      - name: Upload Rust coverage
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: packages/rust-core/coverage.lcov
        if: always()
      - name: WASM node tests
        run: wasm-pack test --node --test wasm_node --locked
        working-directory: packages/rust-core
      - name: Install Chrome for browser tests
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 151.0.7922.138
          install-chromedriver: true
      - name: WASM browser tests
        shell: pwsh
        run: >-
          ./scripts/test-wasm-browser.ps1
          -ChromePath '${{ steps.chrome.outputs.chrome-path }}'
          -ChromeDriver '${{ steps.chrome.outputs.chromedriver-path }}'
        working-directory: packages/rust-core
      - name: Build WASM
        run: >-
          wasm-pack build
          --target web
          --release
          --out-dir ../../apps/web-ui/src/lib/wasm/generated
          --
          --features wasm-start
          --locked
        working-directory: packages/rust-core
      - name: Verify tracked WASM bindings are current
        # wasm-bindgen embeds host-specific source paths in the binary, so a
        # Windows-produced .wasm cannot be compared byte-for-byte on Linux.
        # The generated bindings are deterministic and still detect stale API
        # artifacts while the successful build validates the binary itself.
        run: >-
          git diff --exit-code --
          apps/web-ui/src/lib/wasm/generated/package.json
          apps/web-ui/src/lib/wasm/generated/ttrpg_rust_core.d.ts
          apps/web-ui/src/lib/wasm/generated/ttrpg_rust_core.js
          apps/web-ui/src/lib/wasm/generated/ttrpg_rust_core_bg.wasm.d.ts

  server:
    name: Server (lint + test + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ttrpg_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ttrpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install core-table
        run: pip install -e packages/core-table
      - name: Install locked server development dependencies
        run: pip install --require-hashes -r apps/server/requirements-dev.txt
      - name: Ruff lint
        run: ruff check apps/server packages/core-table
      - name: Mypy type check
        run: mypy apps/server --ignore-missing-imports --no-error-summary
      - name: Pinned Pyright type check
        run: npx --yes pyright@1.1.411
      - name: PostgreSQL migration and behavior gates
        run: >-
          pytest
          tests/integration/test_alembic_baseline.py
          tests/integration/test_postgresql_contract.py
          --no-cov
        working-directory: apps/server
        env:
          TEST_POSTGRESQL_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ttrpg_test
          PYTHONPATH: ${{ github.workspace }}/apps/server:${{ github.workspace }}/packages/core-table
      - name: Alembic head and drift gates
        run: |
          alembic current --check-heads
          alembic check
        working-directory: apps/server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ttrpg_test
      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml
        working-directory: apps/server
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/server:${{ github.workspace }}/packages/core-table
      - name: Upload server coverage
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage
          path: apps/server/coverage.xml
        if: always()
